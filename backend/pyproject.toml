[project]
name = "gradpath-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137,<1",
  "httpx2>=2,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.14,<3",
  "uvicorn>=0.49,<1",
]

[dependency-groups]
dev = [
  "pyright>=1.1,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
